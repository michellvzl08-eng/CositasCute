<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Love You</title>
<!--
  corazon_rojo.html
  Hecho por Michell (michi)
-->
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
  }
  #ayuda {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="ayuda">toca la pantalla para reiniciar</div>
<script>
(function () {
  "use strict";
  // Todo este script es mio (Michell), basado en la misma idea del
  // corazon de particulas pero pasado a canvas para que corra en
  // cualquier navegador, sin depender de python ni pygame.

  const lienzo = document.getElementById("lienzo");
  const ctx = lienzo.getContext("2d");

  const PALABRAS = ["love you", "Love You", "LOVE YOU"];
  const TEXTO_CENTRAL = "I Love You";

  const PALETA_ROJOS = [
    "rgb(178,34,34)",
    "rgb(220,20,60)",
    "rgb(255,0,0)",
    "rgb(200,30,45)",
    "rgb(139,0,0)"
  ];

  let ANCHO = 0, ALTO = 0, DPR = Math.max(1, window.devicePixelRatio || 1);
  let escala = 20;

  function puntoCorazon(t) {
    // formula parametrica clasica del corazon
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [x, -y];
  }

  function aPantalla(x, y) {
    return [x * escala + ANCHO / 2, y * escala + ALTO / 2];
  }

  function distancia(ax, ay, bx, by) {
    return Math.hypot(ax - bx, ay - by);
  }

  function crearContorno(cantidad, minDist) {
    const puntos = [];
    const colocadas = [];
    for (let i = 0; i < cantidad; i++) {
      const t = (i / cantidad) * Math.PI * 2;
      const [bx, by] = puntoCorazon(t);
      const [sx, sy] = aPantalla(bx, by);
      if (colocadas.some(([px, py]) => distancia(sx, sy, px, py) < minDist)) continue;
      colocadas.push([sx, sy]);
      puntos.push({ x: sx, y: sy, orden: i, tipo: "contorno" });
    }
    return puntos;
  }

  function crearRelleno(cantidad, minDist) {
    const puntos = [];
    const colocadas = [];
    let intentos = 0;
    const maxIntentos = cantidad * 80;
    while (puntos.length < cantidad && intentos < maxIntentos) {
      intentos++;
      const t = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.86;
      const [bx, by] = puntoCorazon(t);
      const [sx, sy] = aPantalla(bx * r, by * r);
      if (colocadas.some(([qx, qy]) => distancia(sx, sy, qx, qy) < minDist)) continue;
      colocadas.push([sx, sy]);
      puntos.push({ x: sx, y: sy, orden: Math.floor(Math.random() * 260), tipo: "relleno" });
    }
    return puntos;
  }

  let particulas = [];
  let inicioRelleno = 0;
  let inicioCentro = 0;
  let cuadro = 0;

  function construirEscena() {
    ANCHO = lienzo.clientWidth;
    ALTO = lienzo.clientHeight;
    lienzo.width = ANCHO * DPR;
    lienzo.height = ALTO * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    escala = Math.min(ANCHO, ALTO) / 34;

    const contorno = crearContorno(130, Math.min(ANCHO, ALTO) * 0.028);
    const relleno = crearRelleno(100, Math.min(ANCHO, ALTO) * 0.045);

    const rangoContorno = contorno.reduce((m, p) => Math.max(m, p.orden), 0);
    const cuadrosPorPaso = 1.6;
    inicioRelleno = Math.floor(rangoContorno * cuadrosPorPaso) + 30;
    inicioCentro = inicioRelleno + 200;

    contorno.forEach(p => { p.retraso = Math.floor(p.orden * cuadrosPorPaso); });
    relleno.forEach(p => { p.retraso = inicioRelleno + p.orden; });

    particulas = contorno.concat(relleno).map(p => Object.assign(p, {
      palabra: PALABRAS[Math.floor(Math.random() * PALABRAS.length)],
      color: PALETA_ROJOS[Math.floor(Math.random() * PALETA_ROJOS.length)],
      alfa: 0,
      parpadeo: Math.random() * Math.PI * 2,
      tamano: p.tipo === "contorno" ? 15 : 13,
      escalaExtra: 0.85 + Math.random() * 0.3
    }));

    cuadro = 0;
  }

  function dibujarParticula(p) {
    if (p.alfa <= 0) return;
    const tam = p.tamano * p.escalaExtra;
    ctx.save();
    ctx.font = `bold ${tam}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.globalAlpha = p.alfa / 255;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = p.color;
    ctx.fillText(p.palabra, p.x, p.y);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function dibujarCentro() {
    if (cuadro <= inicioCentro) return;
    const progreso = Math.min(1, (cuadro - inicioCentro) / 60);
    const alfaCentro = 255 * (1 - Math.exp(-progreso * 8));
    const pulso = 1 + 0.03 * Math.sin(cuadro * 0.05);
    const tamBase = Math.min(ANCHO, ALTO) * 0.09;

    ctx.save();
    ctx.font = `bold ${tamBase * pulso}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.globalAlpha = alfaCentro / 255;
    ctx.shadowColor = "rgb(255,60,60)";
    ctx.shadowBlur = 30;
    ctx.fillStyle = "rgb(255,235,230)";
    ctx.fillText(TEXTO_CENTRAL, ANCHO / 2, ALTO / 2);
    ctx.restore();
  }

  function bucle() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, lienzo.width, lienzo.height);
    ctx.restore();

    cuadro++;

    for (const p of particulas) {
      if (cuadro > p.retraso && p.alfa < 255) {
        p.alfa = Math.min(255, p.alfa + 14 + Math.random() * 4);
      }
      let parpadeo = 1.0;
      if (p.alfa >= 255) {
        parpadeo = 0.75 + 0.25 * Math.sin(cuadro * 0.04 + p.parpadeo);
      }
      const alfaOriginal = p.alfa;
      p.alfa = alfaOriginal * parpadeo;
      dibujarParticula(p);
      p.alfa = alfaOriginal;
    }

    dibujarCentro();

    // despues de un rato mostrando el mensaje, reinicio todo el ciclo
    if (cuadro > inicioCentro + 480) {
      construirEscena();
    }

    requestAnimationFrame(bucle);
  }

  window.addEventListener("resize", construirEscena);
  lienzo.addEventListener("click", construirEscena);
  lienzo.addEventListener("touchstart", construirEscena, { passive: true });

  construirEscena();
  requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
